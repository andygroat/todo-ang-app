<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4" (click)="onCancel()"
    (keydown.escape)="onCancel()" tabindex="-1">
    <div class="w-full max-w-md rounded-lg bg-white p-6 shadow-xl" role="dialog" aria-modal="true"
        aria-labelledby="todo-dialog-title" (click)="$event.stopPropagation()">
        <h2 id="todo-dialog-title" class="mb-4 text-lg font-semibold text-slate-900">New Todo</h2>

        <form [formGroup]="form" (ngSubmit)="onSubmit()">
            <label class="mb-1 block text-sm font-medium text-slate-700" for="description">Description</label>
            <input #descriptionInput id="description" type="text" formControlName="description"
                class="mb-1 w-full rounded border border-slate-300 px-3 py-2 focus:border-slate-500 focus:outline-none" />
            @if (form.controls.description.touched && form.controls.description.invalid) {
            <p class="mb-2 text-sm text-red-600">Description is required.</p>
            }

            <label class="mt-4 mb-1 block text-sm font-medium text-slate-700" for="dueDate">Due date (optional)</label>
            <input id="dueDate" type="date" formControlName="dueDate"
                class="w-full rounded border border-slate-300 px-3 py-2 focus:border-slate-500 focus:outline-none" />

            <div class="mt-6 flex justify-end gap-2">
                <button type="button"
                    class="rounded border border-slate-300 px-4 py-2 text-slate-700 hover:bg-slate-100"
                    (click)="onCancel()">
                    Cancel
                </button>
                <button type="submit"
                    class="rounded bg-slate-900 px-4 py-2 text-white hover:bg-slate-700 disabled:opacity-50"
                    [disabled]="saving()">
                    {{ saving() ? 'Saving…' : 'Save' }}
                </button>
            </div>
        </form>
    </div>
</div>
